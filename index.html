<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智享书途 - 登录</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 全局样式 -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[#F3F4F6] min-h-screen flex items-center justify-center">
    <!-- 登录表单容器 -->
    <div class="bg-white rounded-[16px] shadow-md p-[24px] w-full max-w-[360px]">
        <!-- Logo -->
        <div class="flex justify-center mb-[24px]">
            <div class="w-[80px] h-[80px] bg-[#EFF6FF] rounded-full flex items-center justify-center">
                <i class="fa fa-book text-[#2563EB] text-[40px]"></i>
            </div>
        </div>
        
        <!-- 标题 -->
        <h1 class="text-[24px] font-bold text-center text-[#1F2937] mb-[24px]">欢迎登录</h1>
        
        <!-- 登录表单 -->
        <form id="loginForm">
            <!-- 用户名输入框 -->
            <div class="mb-[16px]">
                <label for="username" class="block text-[14px] font-medium text-[#4B5563] mb-[8px]">
                    用户名
                </label>
                <div class="relative">
                    <i class="fa fa-user absolute left-[16px] top-[50%] transform -translate-y-1/2 text-[#9CA3AF]"></i>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="请输入用户名" 
                        class="input pl-[44px]"
                        required
                    >
                </div>
                <span id="userErr" class="text-red-500 text-[12px] mt-[4px] block"></span>
            </div>
            
            <!-- 密码输入框 -->
            <div class="mb-[24px]">
                <div class="flex justify-between items-center mb-[8px]">
                    <label for="password" class="block text-[14px] font-medium text-[#4B5563]">
                        密码
                    </label>
                    <a href="#" class="text-[12px] text-[#2563EB] hover:underline">
                        忘记密码？
                    </a>
                </div>
                <div class="relative">
                    <i class="fa fa-lock absolute left-[16px] top-[50%] transform -translate-y-1/2 text-[#9CA3AF]"></i>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="请输入密码" 
                        class="input pl-[44px]"
                        required
                    >
                </div>
                <span id="pwdErr" class="text-red-500 text-[12px] mt-[4px] block"></span>
            </div>
            
            <!-- 登录按钮 -->
            <button type="submit" class="btn-primary w-full">
                登录
            </button>
            
            <!-- 注册链接 -->
            <div class="flex justify-center mt-[16px]">
                <span class="text-[14px] text-[#4B5563]">还没有账号？</span>
                <a href="pages/verify.html" class="text-[14px] text-[#2563EB] ml-[4px] hover:underline">
                    立即注册
                </a>
            </div>
            
            <!-- 登录结果提示 -->
            <p id="loginResult" class="text-center mt-[16px]"></p>
        </form>
    </div>
    
    <!-- 页脚 -->
    <footer class="absolute bottom-0 left-0 right-0 py-[16px] px-[16px] text-center">
        <p class="text-[12px] text-[#9CA3AF]">© 2023 智享书途 - 校园二手学习资料共享平台</p>
    </footer>
    
    <!-- 登录逻辑 -->
    <script>
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止表单默认提交
            
            // 1. 获取输入值
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // 2. 清空错误提示
            document.getElementById('userErr').textContent = '';
            document.getElementById('pwdErr').textContent = '';
            document.getElementById('loginResult').textContent = '';
            
            // 3. 前端校验
            let valid = true;
            if (!username) {
                document.getElementById('userErr').textContent = '用户名不能为空';
                valid = false;
            }
            if (!password) {
                document.getElementById('pwdErr').textContent = '密码不能为空';
                valid = false;
            }
            if (!valid) return;
            
            // 4. 前端模拟登录成功（实际项目中这里会调用后端API）
            // 假设用户名和密码都为"admin"时登录成功
            if (username === 'admin' && password === 'admin') {
                document.getElementById('loginResult').textContent = '登录成功！正在跳转到首页...';
                document.getElementById('loginResult').style.color = 'green';
                
                // 延迟1秒跳转到首页
                setTimeout(() => {
                    window.location.href = 'pages/home.html';
                }, 1000);
            } else {
                document.getElementById('loginResult').textContent = '用户名或密码错误';
                document.getElementById('loginResult').style.color = 'red';
            }
        });
    </script>
</body>
</html>
